name: CI GitOps Airflow

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Airflow and pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest "apache-airflow>=3.0.0"

      - name: Run DAG integrity, unit and dry-run tests
        env:
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: |
          airflow db migrate
          pytest tests/test_dags_integrity.py -v

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Validate Kustomize overlays (dev & prod)
        run: |
          if [ -d "overlays/dev" ]; then kustomize build overlays/dev > /dev/null; fi
          if [ -d "overlays/prod" ]; then kustomize build overlays/prod > /dev/null; fi