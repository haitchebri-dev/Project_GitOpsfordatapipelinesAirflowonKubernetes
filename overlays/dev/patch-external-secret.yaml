apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-external-secrets
spec:
  data:
    - secretKey: fernet-key
      remoteRef:
        key: airflow/dev/fernet-key
        property: value
    - secretKey: webserver-secret-key
      remoteRef:
        key: airflow/dev/webserver-secret-key
        property: value
    - secretKey: connection
      remoteRef:
        key: airflow/dev/db-connection
        property: value
