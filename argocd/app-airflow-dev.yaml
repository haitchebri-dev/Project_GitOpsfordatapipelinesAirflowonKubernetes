apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow-dev
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/haitchebri-dev/Project_GitOpsfordatapipelinesAirflowonKubernetes.git
      targetRevision: main
      path: overlays/dev
    - repoURL: https://airflow.apache.org
      chart: airflow
      targetRevision: 1.16.0
      helm:
        releaseName: airflow
        valueFiles:
          - $values/base/airflow-values.yaml
    - repoURL: https://github.com/haitchebri-dev/Project_GitOpsfordatapipelinesAirflowonKubernetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
