apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-external-secrets
spec:
  data:
    - secretKey: fernet-key
      remoteRef:
        key: airflow-prod-fernet-key
        property: value
    - secretKey: webserver-secret-key
      remoteRef:
        key: airflow-prod-webserver-secret-key
        property: value
    - secretKey: connection
      remoteRef:
        key: airflow-prod-db-connection
        property: value